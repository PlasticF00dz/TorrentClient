# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/bittorrent_client;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console (for development/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# For logs
logging.level.org.springframework.web=INFO
logging.level.com.bittorrent=DEBUG

# Torrent file storage directories (absolute paths)
torrent.meta.dir=D:/projects/Torrentclient/TorrentClient/backend/torrents
torrent.download.dir=D:/projects/Torrentclient/TorrentClient/backend/downloads

